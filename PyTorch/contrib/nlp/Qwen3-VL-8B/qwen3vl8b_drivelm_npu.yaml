### Complete DriveLM public training annotations, with a fixed local scene holdout.
### Paths and cutoff_len are supplied only after tools/prepare_full_data.py passes.
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
trust_remote_code: true
image_max_pixels: 262144
video_max_pixels: 16384
flash_attn: disabled

stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 8
lora_target: all

dataset: drivelm_nus_v11_train
eval_dataset: drivelm_nus_v11_dev
template: qwen3_vl_nothink
cutoff_len: 4096
packing: false
preprocessing_num_workers: 4
dataloader_num_workers: 2

output_dir: test/output/drivelm_full
logging_steps: 10
save_strategy: epoch
save_total_limit: 2
save_only_model: false
eval_strategy: epoch
per_device_eval_batch_size: 1
prediction_loss_only: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
max_grad_norm: 1.0
seed: 42
ddp_timeout: 1200
